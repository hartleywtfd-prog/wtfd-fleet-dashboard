<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    :root{--navy:#0b2545;--blue:#1c4f7c;--teal:#0f766e;--red:#b42318;--amber:#b54708;--green:#16803c;--ink:#172033;--muted:#64748b;--line:#d9e2ec;--wash:#f3f6f9;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,a{font:inherit}.shell{min-height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px clamp(18px,4vw,54px);background:linear-gradient(120deg,var(--navy),#153d67);color:#fff;box-shadow:0 5px 18px #0b25452e}
    .brand{display:flex;align-items:center;gap:14px}.brand-logo{width:52px;height:52px;object-fit:contain;border-radius:10px;background:#fff;box-shadow:0 2px 8px #0003}.brand h1{margin:0;font-size:clamp(18px,2vw,26px);letter-spacing:.01em}.brand p{margin:2px 0 0;color:#dbeafe;font-size:12px}
    .nav{display:flex;gap:8px}.nav button{padding:9px 13px;border:1px solid #ffffff45;border-radius:8px;background:#ffffff12;color:#fff;font-weight:800;cursor:pointer}.nav button.active{background:#fff;color:var(--navy)}
    main{width:min(1500px,calc(100% - 32px));margin:24px auto 46px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:16px}.page-head h2{margin:0;font-size:24px;color:var(--navy)}.eyebrow{margin:0 0 3px;color:var(--teal);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.updated{color:var(--muted);font-size:12px;text-align:right}
    .metrics{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;margin:0 0 18px}.metric,.card{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 3px 12px #0b25450c}.metric{padding:15px}.metric span{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.metric strong{display:block;margin-top:5px;color:var(--navy);font-size:27px}.metric.warn{border-top:4px solid var(--amber)}.metric.bad{border-top:4px solid var(--red)}.metric.good{border-top:4px solid var(--teal)}
    .grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(330px,.6fr);gap:18px}.card{overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.card-head h3{margin:0;color:var(--navy);font-size:15px}.card-body{padding:15px 16px}.stack{display:grid;gap:18px}
    .table-wrap{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;white-space:nowrap}th{position:sticky;top:0;z-index:1;padding:10px 12px;background:#edf2f7;color:#46566b;font-size:10px;letter-spacing:.04em;text-align:left;text-transform:uppercase}td{padding:10px 12px;border-top:1px solid #edf1f5;vertical-align:top}.wrap{max-width:360px;white-space:normal}.member-link{border:0;background:transparent;color:#145da0;font-weight:850;cursor:pointer;padding:0;text-align:left}.member-link:hover{text-decoration:underline}
    .pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#e2e8f0;color:#334155;font-size:10px;font-weight:900;text-transform:uppercase}.pill.critical,.pill.expired{background:#fee4e2;color:var(--red)}.pill.high,.pill.behind{background:#fff0dc;color:var(--amber)}.pill.moderate{background:#fff8c5;color:#805b10}.pill.on-track,.pill.current,.pill.compliant{background:#dcfce7;color:var(--green)}
    .gap-row{margin:0 0 13px}.gap-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;font-weight:800}.bar{height:9px;overflow:hidden;border-radius:999px;background:#e5eaf0}.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),#2aa198)}
    .empty{padding:26px;color:var(--muted);text-align:center}.loading{display:grid;place-items:center;min-height:55vh;color:var(--navy);font-weight:800}.spinner{width:34px;height:34px;margin-bottom:10px;border:4px solid #dbe6ef;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .member-hero{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px;border-radius:14px;background:linear-gradient(125deg,var(--navy),#1d507e);color:#fff}.member-hero h2{margin:0;font-size:27px}.member-hero p{margin:4px 0 0;color:#dbeafe}.priority{text-align:right}.priority .pill{font-size:12px}.back{margin-bottom:12px;border:0;background:transparent;color:#145da0;font-weight:850;cursor:pointer}
    .member-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.detail{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}.detail span{display:block;color:var(--muted);font-size:10px;font-weight:850;text-transform:uppercase}.detail strong{display:block;margin-top:5px;color:var(--navy);font-size:18px}.iso-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.iso-box{padding:12px;border-radius:9px;background:#f6f9fb;text-align:center}.iso-box strong,.iso-box span{display:block}.iso-box span{color:var(--muted);font-size:10px;text-transform:uppercase}.notice{padding:12px;border-left:4px solid var(--teal);background:#ecfdf5;color:#14532d}
    @media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.member-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){.topbar,.page-head,.member-hero{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}.metrics{grid-template-columns:repeat(2,1fr)}.member-grid,.iso-grid{grid-template-columns:1fr 1fr}.updated,.priority{text-align:left}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="logo.png" alt="Washington Township Fire Department logo"><div><h1>Operational Readiness</h1><p>Washington Township Fire Department</p></div></div>
      <nav class="nav"><button id="officerNav" onclick="showOfficer()">Officer Dashboard</button></nav>
    </header>
    <main id="app"><div class="loading"><div><div class="spinner"></div>Loading readiness data…</div></div></main>
  </div>
  <script>
    const query = new URLSearchParams(location.search);
    const INITIAL = {
      view: query.get('view') === 'member' ? 'member' : 'officer',
      crewSenseId: query.get('crewSenseId') || '',
      name: query.get('name') || ''
    };
    const app = document.getElementById('app');
    const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const num = value => Number(value || 0);
    const pct = value => `${Math.round(num(value) * 100)}%`;
    const hours = value => `${num(value).toFixed(1)} h`;
    const dateText = value => value ? new Date(value).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    const cls = value => String(value || '').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const pill = value => `<span class="pill ${cls(value)}">${esc(value || '—')}</span>`;
    const load = async request => {
      try {
        app.setAttribute('aria-busy', 'true');
        const params = new URLSearchParams(request);
        const response = await fetch(`/api/readiness?${params.toString()}`, {
          headers: { Accept: 'application/json' },
          cache: 'no-store'
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        render(data);
      } catch (error) {
        app.innerHTML = `<div class="card empty"><h2>Unable to load readiness data</h2><p>${esc(error.message || error)}</p></div>`;
      } finally {
        app.removeAttribute('aria-busy');
      }
    };
    function showOfficer(){history.replaceState({},'',location.pathname+'?view=officer');load({view:'officer'})}
    function showMember(id,name){const query=`?view=member&crewSenseId=${encodeURIComponent(id||'')}&name=${encodeURIComponent(name||'')}`;history.replaceState({},'',location.pathname+query);load({view:'member',crewSenseId:id,name})}
    function metric(label,value,tone=''){return `<div class="metric ${tone}"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`}
    function render(data){document.getElementById('officerNav').classList.toggle('active',data.view==='officer');data.view==='member'?renderMember(data):renderOfficer(data)}
    function renderOfficer(data){
      const m=data.metrics;
      const needs=(data.needs||[]).map(row=>{const recommendation=row.Recommendations||row['Recommended Action']||row['Recommended Actions']||'—';return `<tr><td><button class="member-link" onclick='showMember("",${JSON.stringify(String(row.Member||""))})'>${esc(row.Member)}</button><br><small>${esc(row.Unit)}</small></td><td>${pill(row.Priority)}</td><td>${pct(row['ISO Progress'])}<br>${pill(row['ISO Status'])}</td><td>${esc(row['Urgent Credential']||'—')}<br><small>${row['Days Left']===''?'':esc(row['Days Left']+' days')}</small></td><td>${esc(num(row['Overdue Count']))}</td><td>${hours(row['7-Day Hours'])}</td><td class="wrap">${esc(recommendation)}</td></tr>`}).join('');
      const gaps=(data.gaps||[]).map(row=>{const ready=Math.max(0,Math.min(1,num(row['Crew Ready %'])));return `<div class="gap-row"><div class="gap-label"><span>${esc(row.Category)}</span><span>${pct(ready)}</span></div><div class="bar"><span style="width:${ready*100}%"></span></div><small>${esc(row['Members Behind'])} members behind</small></div>`}).join('');
      const actions=(data.actions||[]).slice(0,12).map(row=>`<tr><td>${pill(row.Priority)}</td><td>${esc(row.Member)}</td><td>${esc(row.Unit)}</td><td>${esc(row.Item||row.Category)}</td><td class="wrap">${esc(row['Recommended Action'])}</td></tr>`).join('');
      app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Live on-duty crew</p><h2>Officer Readiness Dashboard</h2></div><div class="updated">${esc(data.updatedText)}<br>Report date ${dateText(data.reportDate)} · Unit ${esc(data.unitFilter)}</div></div>
      <section class="metrics">${metric('On-Duty Members',m.onDuty,'good')}${metric('ISO Members Behind',m.isoBehind,m.isoBehind?'warn':'good')}${metric('Credentials Due ≤90',m.credentialsDue,m.credentialsDue?'warn':'good')}${metric('Overdue Assignments',m.overdueAssignments,m.overdueAssignments?'bad':'good')}${metric('7-Day Training Hours',num(m.sevenDayHours).toFixed(1),'good')}${metric('No Training in 7 Days',m.noTraining,m.noTraining?'warn':'good')}</section>
      <div class="grid"><section class="card"><div class="card-head"><h3>Current Crew Needs</h3><span>${data.needs.length} on-duty members</span></div><div class="table-wrap"><table><thead><tr><th>Member / Unit</th><th>Priority</th><th>ISO</th><th>Credential</th><th>Overdue</th><th>7-Day Hours</th><th>Recommended Action</th></tr></thead><tbody>${needs||'<tr><td colspan="7" class="empty">No on-duty records</td></tr>'}</tbody></table></div></section>
      <div class="stack"><section class="card"><div class="card-head"><h3>Top Training Gaps</h3></div><div class="card-body">${gaps||'<div class="empty">No category gaps</div>'}</div></section><section class="card"><div class="card-head"><h3>Immediate Actions</h3></div><div class="table-wrap"><table><thead><tr><th>Priority</th><th>Member</th><th>Unit</th><th>Item</th><th>Action</th></tr></thead><tbody>${actions||'<tr><td colspan="5" class="empty">No immediate actions</td></tr>'}</tbody></table></div></section></div></div>`;
    }
    function renderMember(data){
      if(!data.found){app.innerHTML=`<button class="back" onclick="showOfficer()">← Officer Dashboard</button><div class="card empty"><h2>Member report unavailable</h2><p>${esc(data.message)}</p></div>`;return}
      const m=data.member;
      const iso=Object.entries(data.iso||{}).filter(([,v])=>num(v[1])>0).map(([label,v])=>`<div class="iso-box"><span>${esc(label)}</span><strong>${num(v[0]).toFixed(1)} / ${num(v[1]).toFixed(1)} h</strong></div>`).join('');
      const credentials=(data.credentials||[]).map(row=>`<tr><td>${esc(row.Credential)}</td><td>${dateText(row['Display Expiration']||row['Expiration Date']||row.Expiration)}</td><td>${esc(row['Days Left'])}</td><td>${pill(row.Status)}</td></tr>`).join('');
      const recent=(data.last7||[]).map(row=>`<tr><td>${dateText(row['Completion Date'])}</td><td class="wrap">${esc(row['Course']||row['Assignment Name'])}</td><td>${hours(row.Hours)}</td><td class="wrap">${esc(row['ISO Categories'])}</td><td class="wrap">${esc(row['Ohio Categories'])}</td></tr>`).join('');
      const actions=(data.actions||[]).map(row=>`<tr><td>${pill(row.Priority)}</td><td>${esc(row.Category)}</td><td class="wrap">${esc(row.Item)}</td><td class="wrap">${esc(row['Recommended Action'])}</td></tr>`).join('');
      app.innerHTML=`<button class="back" onclick="showOfficer()">← Officer Dashboard</button><section class="member-hero"><div><p class="eyebrow">Individual training report</p><h2>${esc(m.name)}</h2><p>${esc(m.displayUnit)} · ${esc(m.positions||'On-duty member')}</p></div><div class="priority"><small>READINESS PRIORITY</small><br>${pill(m.priority)}</div></section>
      <section class="member-grid">${metric('ISO Progress',pct(m.isoProgress))}${metric('Pace Delta',pct(m.paceDelta))}${metric('7-Day Training',hours(m.sevenDayHours))}${metric('Overdue Assignments',m.overdueCount)}</section>
      <div class="grid"><div class="stack"><section class="card"><div class="card-head"><h3>ISO Category Progress</h3><span>${esc(m.isoRoles||'Assigned roles')}</span></div><div class="card-body"><div class="iso-grid">${iso||'<div class="empty">No ISO category targets found</div>'}</div></div></section>
      <section class="card"><div class="card-head"><h3>Recent Training · 7 Days</h3></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Course</th><th>Hours</th><th>ISO Categories</th><th>Ohio Categories</th></tr></thead><tbody>${recent||'<tr><td colspan="5" class="empty">No recorded training in the current 7-day window</td></tr>'}</tbody></table></div></section></div>
      <div class="stack"><section class="card"><div class="card-head"><h3>Credentials</h3></div><div class="table-wrap"><table><thead><tr><th>Credential</th><th>Expires</th><th>Days</th><th>Status</th></tr></thead><tbody>${credentials||'<tr><td colspan="4" class="empty">No credential records found</td></tr>'}</tbody></table></div></section>
      <section class="card"><div class="card-head"><h3>Recommended Actions</h3></div><div class="card-body"><div class="notice">${esc(m.recommendations||(String(m.priority||'').toUpperCase()==='ON TRACK'?'Maintain current pace':'Review the priority actions below'))}</div></div><div class="table-wrap"><table><tbody>${actions}</tbody></table></div></section></div></div>`;
    }
    load(INITIAL);
  </script>
</body>
</html>
